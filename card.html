<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ganga Ananthoju — SysInt Inc</title>
  <meta name="description" content="Ganga Ananthoju, Founder & AI Engineer at SysInt Inc. Enterprise integration and AI engineering." />
  <link rel="icon" type="image/png" href="logos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060814;
      --cyan: #18c8ff;
      --violet: #8d1cff;
      --orange: #ff7a00;
      --blue: #1f7cff;
      --muted: #aeb8d0;
      --text: #eef3ff;
      --line: rgba(255,255,255,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(24,200,255,0.18), transparent 40%),
        radial-gradient(ellipse at 85% 10%, rgba(141,28,255,0.20), transparent 38%),
        radial-gradient(ellipse at 80% 85%, rgba(255,122,0,0.14), transparent 35%),
        radial-gradient(ellipse at 10% 80%, rgba(31,124,255,0.12), transparent 32%),
        linear-gradient(180deg, #060814 0%, #0a1020 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 28px;
    }

    /* ── SCENE ── */
    .scene {
      width: 420px;
      height: 236px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow:
        0 32px 80px rgba(0,0,0,0.60),
        0 0 0 1px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.10);
    }

    /* ── FRONT ── */
    .card-front {
      background:
        radial-gradient(ellipse at 0% 0%, rgba(24,200,255,0.22), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(141,28,255,0.22), transparent 55%),
        linear-gradient(135deg, #0d1528 0%, #0a1020 60%, #110820 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px;
    }

    .front-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .front-logo img {
      height: 72px;
      width: auto;
      object-fit: contain;
      opacity: 0.92;
    }

    .front-tagline {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.7;
      text-align: right;
      line-height: 1.5;
    }

    .front-bottom { text-align: right; }

    .front-name {
      font-size: 1.38rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.80) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .front-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* accent line bottom-left */
    .card-front::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--orange));
    }

    /* decorative dot grid */
    .card-front::before {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 160px; height: 160px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1px, transparent 1px);
      background-size: 16px 16px;
      mask-image: radial-gradient(ellipse at 80% 20%, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 80% 20%, black 30%, transparent 70%);
    }

    /* ── BACK ── */
    .card-back {
      transform: rotateY(180deg);
      background:
        radial-gradient(ellipse at 100% 0%, rgba(255,122,0,0.18), transparent 50%),
        radial-gradient(ellipse at 0% 100%, rgba(24,200,255,0.16), transparent 50%),
        linear-gradient(135deg, #110820 0%, #0a1020 60%, #0d1528 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 36px;
      gap: 14px;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .back-icon svg {
      width: 15px; height: 15px;
      fill: var(--cyan);
    }

    .back-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
      margin-bottom: 3px;
    }

    .back-value {
      font-size: 0.86rem;
      font-weight: 600;
      color: #eef3ff;
      line-height: 1;
    }

    .back-divider {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .card-back::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--orange), var(--violet), var(--cyan));
    }

    /* ── HINT ── */
    .flip-hint {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flip-hint svg { width: 14px; height: 14px; fill: var(--muted); }

    /* ── ACTIONS ── */
    .card-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-save {
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--orange));
      color: #fff;
      border: none;
      box-shadow: 0 6px 22px rgba(141,28,255,0.30);
    }

    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(141,28,255,0.45); }

    .btn-web {
      background: rgba(255,255,255,0.06);
      color: #eef3ff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-web:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.22); }

    .btn-print {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-print:hover { background: rgba(255,255,255,0.07); color: #fff; }

    /* ── PRINT STYLES ── */
    @media print {
      body {
        background: #fff !important;
        padding: 0;
        justify-content: flex-start;
      }

      .flip-hint, .card-actions { display: none !important; }

      .scene {
        width: 3.5in;
        height: 2in;
        page-break-inside: avoid;
        cursor: default;
        perspective: none;
      }

      .card-inner { transform: none !important; transition: none; }

      .card-front {
        box-shadow: none;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: linear-gradient(135deg, #0d1528, #0a1020, #110820) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card-back { display: none; }
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .scene { width: calc(100vw - 48px); height: auto; aspect-ratio: 1.78; }
      .front-name { font-size: 1.1rem; }
      .back-value { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <div class="scene" id="card" onclick="this.classList.toggle('flipped')" title="Click to flip">

    <div class="card-inner">

      <!-- FRONT -->
      <div class="card-face card-front">
        <div class="front-top">
          <div class="front-logo">
            <img src="logos/sidelogo-text.png" alt="SysInt Inc" />
          </div>
          <div class="front-tagline">Integration<br>Intelligence<br>Inference</div>
        </div>
        <div class="front-bottom">
          <div class="front-name">Ganga Ananthoju</div>
          <div class="front-title">Founder & AI Engineer</div>
        </div>
      </div>

      <!-- BACK -->
      <div class="card-face card-back">

        <div class="back-row">
          <div class="back-icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <div>
            <div class="back-label">Email</div>
            <div class="back-value">gangadhar.ananthoju@sysintinc.com</div>
          </div>
        </div>

        <div class="back-divider"></div>

        <div class="back-row">
          <div class="back-icon">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </div>
          <div>
            <div class="back-label">Phone</div>
            <div class="back-value">440-364-6078</div>
          </div>
        </div>

        <div class="back-divider"></div>

        <div class="back-row">
          <div class="back-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <div>
            <div class="back-label">Website</div>
            <div class="back-value">www.sysintinc.com</div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <p class="flip-hint">
    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    Tap card to flip
  </p>

  <div class="card-actions">
    <a class="action-btn btn-save" href="#" onclick="saveVCard(event)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      Save Contact
    </a>
    <a class="action-btn btn-web" href="index.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Visit Website
    </a>
    <button class="action-btn btn-print" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      Print
    </button>
  </div>

  <script>
    function saveVCard(e) {
      e.preventDefault();
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Ganga Ananthoju',
        'N:Ananthoju;Ganga;;;',
        'ORG:SysInt Inc',
        'TITLE:Founder & AI Engineer',
        'TEL;TYPE=WORK,VOICE:440-364-6078',
        'EMAIL;TYPE=WORK:gangadhar.ananthoju@sysintinc.com',
        'URL:https://www.sysintinc.com',
        'END:VCARD'
      ].join('\n');

      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Ganga_Ananthoju_SysInt.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
